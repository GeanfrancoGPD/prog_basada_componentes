<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">
        Regístrate para comenzar a gestionar tus metas
      </p>
    </div>

    <form class="auth-form">
      <div class="tg-field">
        <label for="username">Nombre Completo</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Juan Pérez"
          required
        />
      </div>

      <div class="tg-field">
        <label for="gmail">Correo Electrónico</label>
        <input
          id="gmail"
          name="gmail"
          type="email"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="tg-row">
        <div class="tg-field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="tg-field">
          <label for="confirmPassword">Confirmar</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>
      </div>

      <button type="submit" class="tg-btn tg-btn--primary">Registrarse</button>
    </form>

    <div class="auth-footer">
      <p>
        ¿Ya tienes cuenta? <a href="/login" class="auth-link">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
